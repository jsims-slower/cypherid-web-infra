name: Terraform Apply Component Call
run-name: Terraform Apply Component Call with env ${{ inputs.environment }} component ${{ inputs.component }} workflow ${{ inputs.run-id }}

on:
  workflow_call:
    inputs:
      environment:
        description: Both Github Environment and AWS Environment
        type: string
        required: true
      component:
        description: 'Fogg Component, located in the terraform/emvs/<environment>/<component> directory'
        type: string
        required: true
      run-id:
        description: Github Action Workflow Run ID of a Terraform Plan all Components run
        type: number
        required: false
    secrets:
      AUTH0_CLIENT_ID:
        required: true
      AUTH0_CLIENT_SECRET:
        required: true
      AUTH0_DOMAIN:
        required: true

env:
  AWS_REGION: us-west-2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-component:
    name: Terraform Apply Component - ${{ inputs.component }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reconfigure Git to use HTTP authentication
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          verbose: false
          arch: amd64
      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/czid-${{ inputs.environment }}-gh-actions-executor
          #output-credentials: true
          output-env-credentials: true
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: idseq-${{ inputs.environment }}
      - name: Configure AWS Credentials for local execution using nektos act
        if: ${{ env.ACT }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: czid-${{ inputs.environment }}-gh-actions-executor
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          #output-credentials: true
          output-env-credentials: true
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: idseq-${{ inputs.environment }}
      - name: Setup Terraform
        run: |
          aws sts get-caller-identity --profile "idseq-${{ inputs.environment }}" --no-cli-pager --no-cli-auto-prompt
          make terraform
          .fogg/tfenv/bin/terraform --version
      - name: Download Plan Artifact
        if: ${{ inputs.run-id }}
        uses: actions/download-artifact@v5
        with:
          name: 'plan-${{ inputs.component }}'
          path: './terraform/envs/${{ inputs.environment }}/${{ inputs.component }}/'
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Terraform Init
        working-directory: './terraform/envs/${{ inputs.environment }}/${{ inputs.component }}/'
        run: |
          make check-auth
          ${{ github.workspace }}/.fogg/tfenv/bin/terraform init -input=false -upgrade
      - name: Terraform Plan
        if: ${{ !inputs.run-id }}
        working-directory: './terraform/envs/${{ inputs.environment }}/${{ inputs.component }}'
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
        run: |
          ${{ github.workspace }}/.fogg/tfenv/bin/terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        working-directory: "./terraform/envs/${{ inputs.environment }}/${{ inputs.component }}/"
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
        run: |
          ${{ github.workspace }}/.fogg/tfenv/bin/terraform apply -input=false -auto-approve tfplan
